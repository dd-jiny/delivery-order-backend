services:
  db:
    image: postgres:18
    container_name: delivery-db
    environment:
      POSTGRES_DB: delivery
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - delivery-db-data:/var/lib/postgresql

volumes:
  delivery-db-data:
