spring:
  application:
    name: delivery

  # DB 연결 — 값은 환경 변수(.env)로 주입
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # 페이징: 기본 크기 10, 최대 50 (초과하면 50으로 보정)
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 50

jwt:
  secret: ${JWT_SECRET}
